name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# El token del workflow solo necesita leer el repositorio. El unico job que
# necesita mas es `publish`, y lo pide para si mismo. Ninguna etapa despliega
# infraestructura desde CI.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.19.0'

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      # La verificacion de tipos usa TypeScript 7 mediante el alias `typescript7`.
      # typescript-eslint y ts-jest usan la API de TypeScript 6. Vease ADR-003.
      - name: Verificacion de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Pruebas de integracion
        run: npm run test:integration

      - name: Cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-notifications
          path: coverage/
          retention-days: 7

      - name: Compilar el worker
        run: npm run build

  docker:
    name: Imagen del worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Este job solo construye y verifica. Publicar es trabajo de `publish`, que
      # solo se ejecuta desde `main` y depende de que este termine en verde.
      - name: Construir imagen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: nexus-battle-notifications:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar arranque del contenedor
        run: |
          docker run -d --name notifications-ci -p 3001:3001 nexus-battle-notifications:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/health/ready > /dev/null; then
              echo "readiness correcta en el intento ${attempt}"
              curl -fsS http://127.0.0.1:3001/version
              docker rm -f notifications-ci > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "El contenedor no alcanzo el estado ready"
          docker logs notifications-ci
          docker rm -f notifications-ci > /dev/null
          exit 1

  publish:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    # Solo desde `main`, nunca desde un pull request. Si un PR pudiera publicar,
    # cualquiera capaz de abrir uno escribiria en el registro de la organizacion.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # `packages: write` se concede AQUI y no en la cabecera del fichero. Los
    # demas jobs no lo necesitan, y un permiso que abarca todo el workflow deja
    # de estar asociado al paso que lo usa.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Iniciar sesion en GHCR
        env:
          REGISTRO_USUARIO: ${{ github.actor }}
          REGISTRO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRO_TOKEN" | docker login ghcr.io -u "$REGISTRO_USUARIO" --password-stdin

      # Tres etiquetas, cada una responde a una pregunta distinta:
      #
      #   latest       lo que la composicion de referencia trae por defecto;
      #   sha-<corto>  de que commit exacto salio la imagen, sin ambiguedad;
      #   <semver>     que version declara el paquete, la misma que sirve /version.
      #
      # El propietario se pasa a minusculas a proposito: GHCR no admite
      # `Nexus-Battle-VI` como ruta de registro y el push fallaria.
      - name: Calcular etiquetas
        id: etiquetas
        env:
          PROPIETARIO: ${{ github.repository_owner }}
          COMMIT: ${{ github.sha }}
        run: |
          imagen="ghcr.io/$(echo "$PROPIETARIO" | tr '[:upper:]' '[:lower:]')/nexus-battle-notifications"
          version="$(node -p "require('./package.json').version")"
          {
            echo 'lista<<FIN'
            echo "${imagen}:latest"
            echo "${imagen}:sha-${COMMIT:0:12}"
            echo "${imagen}:${version}"
            echo 'FIN'
          } >> "$GITHUB_OUTPUT"

      # Se reconstruye desde el mismo commit y con la misma cache que el job
      # anterior, asi que el trabajo real es un acierto de cache. Lo que
      # garantiza que se publica algo comprobado no es la cache, sino
      # `needs: docker`: sin ese job en verde, este no llega a ejecutarse.
      - name: Construir y publicar
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Los nodos de la demo son Graviton: `t4g.small` es arm64. Sin esta
          # linea la imagen sale solo para amd64 y el nodo la rechaza con
          # "no matching manifest for linux/arm64/v8".
          #
          # Se construyen las DOS: los portatiles del equipo son amd64 y la
          # composicion de referencia tiene que seguir levantando en ellos.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.etiquetas.outputs.lista }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
